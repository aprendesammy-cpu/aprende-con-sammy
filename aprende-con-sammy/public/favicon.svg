  <ellipse cx="43.5" cy="38" rx="2.8" ry="1.8" fill="#FF7D7D" opacity="0.55"/>
  <!-- Hojita de bambú (Calma) -->
  <path d="M32 15 C 28.5 12.5, 26 13.5, 25.5 15.8 C 28.5 17, 31 16.5, 32 15 Z" fill="#A8E6CF"/>
  <path d="M32 15 C 35.5 12.5, 38 13.5, 38.5 15.8 C 35.5 17, 33 16.5, 32 15 Z" fill="#FFCB3D"/>
