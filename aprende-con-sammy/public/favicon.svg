      <stop offset="0" stop-color="#00B4A6"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sammy-bg)"/>
  <!-- Orejas -->
  <circle cx="19" cy="17" r="7" fill="#1E2A44"/>
  <circle cx="45" cy="17" r="7" fill="#1E2A44"/>
  <!-- Cara -->
  <circle cx="32" cy="34" r="19" fill="#FFFFFF"/>
  <!-- Manchas de los ojos -->
  <ellipse cx="25" cy="31" rx="5" ry="6.5" fill="#1E2A44" transform="rotate(-16 25 31)"/>
  <ellipse cx="39" cy="31" rx="5" ry="6.5" fill="#1E2A44" transform="rotate(16 39 31)"/>
  <circle cx="25.6" cy="30" r="2.1" fill="#FFFFFF"/>
  <circle cx="38.4" cy="30" r="2.1" fill="#FFFFFF"/>
  <circle cx="26.1" cy="30.4" r="1.05" fill="#1E2A44"/>
  <circle cx="37.9" cy="30.4" r="1.05" fill="#1E2A44"/>
  <!-- Nariz y sonrisa -->
